# One-click deploy on Render: https://render.com/deploy?repo=https://github.com/ironlady125/Maryna-website
services:
  - type: web
    name: maryna-moroz-fitness
    runtime: docker
    plan: starter
    healthCheckPath: /en
    disk:
      name: data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SMTP_URL
        sync: false
      - key: EMAIL_FROM
        sync: false
